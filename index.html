    select(x?x.object.userData.id:null)}
  refresh(){this.m.forEach(m=>{m.visible=!hide.has(m.userData.id);m.material.emissiveIntensity=sel===m.userData.id?1.1:.12})}
  tick(){const w=this.box.clientWidth,h=this.box.clientHeight;if(!w||!h)return;
    if(this.W!==w||this.H!==h){this.W=w;this.H=h;this.r.setSize(w,h,false);this.c.aspect=w/h;this.c.updateProjectionMatrix()}
    const c=this.c;
    if(this.hero){this.g.rotation.y+=.002;const z=7-Math.min(scrollY/innerHeight,1)*4;
      c.position.x+=(mx*1.2-c.position.x)*.05;c.position.y+=(my*.8-c.position.y)*.05;c.position.z+=(z-c.position.z)*.05}
    else{if(sel===null&&!this.p.size)this.th+=.003;const s=Math.sin(this.ph)*this.R;c.position.set(s*Math.sin(this.th),Math.cos(this.ph)*this.R,s*Math.cos(this.th))}
    c.lookAt(0,0,0);this.r.render(this.s,c)}
}
const hero=new View($('#hs'),'animal',true);hero.box.prepend(hero.r.domElement);
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=-(e.clientY/innerHeight*2-1)});
(function loop(){requestAnimationFrame(loop);hero.tick();V.forEach(v=>v.tick())})();

function setMode(m){mode=m;V.forEach(v=>{v.r.dispose();v.box.remove()});V=[];
  const kinds=m==='split'?['animal','plant']:[m];$('#cv').className=kinds.length>1?'sp':'';
  kinds.forEach(k=>{const b=document.createElement('div');b.className='cvb g';b.innerHTML='<span class="lb" data-i="'+k+'"></span>';$('#cv').appendChild(b);V.push(new View(b,k))});
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('a',b.dataset.m===m));V.forEach(v=>v.refresh());applyLang()}
function select(id){sel=id;V.forEach(v=>v.refresh());renderList();renderInfo()}
function ids(){const s=new Set();(mode==='split'?['animal','plant']:[mode]).forEach(k=>PARTS[k].forEach(p=>s.add(p.id)));return[...s]}
function renderList(){const el=$('#list');el.innerHTML='';ids().forEach(id=>{const d=document.createElement('div');d.className='it'+(sel===id?' s':'');
  d.innerHTML='<button class="n"><i style="background:'+COLOR[id]+'"></i>'+INFO[id].n[Lg]+'</button><button class="h'+(hide.has(id)?' x':'')+'" title="'+T[Lg].hide+'">👁</button>';
  d.children[0].onclick=()=>{hide.delete(id);select(id)};
  d.children[1].onclick=()=>{hide.has(id)?hide.delete(id):hide.add(id);V.forEach(v=>v.refresh());renderList()};el.appendChild(d)})}
function renderInfo(){const I=sel&&INFO[sel];$('#info').innerHTML=I?'<b style="color:#5eead4;font-size:17px">'+I.n[Lg]+'</b><div class="mu">'+LG.filter(x=>x!==Lg).map(x=>I.n[x]).join(' · ')+'</div><p style="margin:6px 0 0">'+I.f[Lg]+'</p>':'<span class="mu">'+T[Lg].hint+'</span>'}

let qi=0,pk=null,score=0;
function renderQuiz(){const el=$('#quiz'),t=T[Lg];
  if(qi>=Q.length){el.innerHTML='<div class="g box c"><h2>'+t.result+': '+score+'/'+Q.length+'</h2><button class="b">'+t.again+'</button></div>';el.querySelector('.b').onclick=()=>{qi=0;score=0;pk=null;renderQuiz()};return}
  const q=Q[qi],I=INFO[q.o[q.a]],txt=q.k==='d'?t.qd+' «'+I.f[Lg]+'»':t['q'+q.k];
  el.innerHTML='<div class="g box"><span class="mu">'+t.q+' '+(qi+1)+'/'+Q.length+' · '+score+'</span><h2>'+txt+'</h2>'+
  q.o.map((id,n)=>'<button class="opt '+(pk===null?'':n===q.a?'ok':n===pk?'no':'dim')+'" data-n="'+n+'">'+INFO[id].n[Lg]+'</button>').join('')+
  (pk!==null?'<p class="'+(pk===q.a?'okt':'not')+'">'+(pk===q.a?t.right:t.wrong+I.n[Lg])+'</p><p>'+I.n[Lg]+': '+I.f[Lg]+'</p><button class="b" id="nx">'+(qi+1===Q.length?t.finish:t.next)+'</button>':'')+'</div>';
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(pk!==null)return;pk=+b.dataset.n;if(pk===q.a)score++;renderQuiz()});
  const nx=$('#nx');if(nx)nx.onclick=()=>{qi++;pk=null;renderQuiz()}}

function applyLang(){document.documentElement.lang=Lg;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[Lg][e.dataset.i]);
  document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('a',b.dataset.l===Lg));renderList();renderInfo();renderQuiz()}
function go(p){page=p;document.querySelectorAll('section').forEach(s=>s.classList.toggle('a',s.id===p));
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('a',b.dataset.p===p));scrollTo(0,0);if(p==='explore'&&!V.length)setMode(mode)}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{Lg=b.dataset.l;applyLang()});
applyLang();go('home');
</script></body></html>
